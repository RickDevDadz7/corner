# Monta o app Android (APK de teste) toda vez que o app muda.
# Link fixo pra baixar no celular: https://github.com/RickDevDadz7/corner/releases/download/apk-teste/tairen-teste.apk
name: Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run android:sync
      - name: Montar APK de teste
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tairen-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Publicar no link fixo de teste
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk tairen-teste.apk
          gh release view apk-teste >/dev/null 2>&1 || gh release create apk-teste --prerelease --title "TAIREN — APK de teste" --notes "Versão de teste, atualizada sozinha a cada mudança no app."
          gh release upload apk-teste tairen-teste.apk --clobber
